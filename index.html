<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julius Scharinger</title>
<style>
  :root{
    --bg:#F6F4F0;
    --card:#FFFFFF;
    --ink:#1B1C20;
    --ink-soft:rgba(27,28,32,0.58);
    --line:rgba(27,28,32,0.1);
    --accent-a:#5B57EA;
    --accent-b:#E94F86;
    --pill:#F6F4F0;
    --pill-hover:#EDEAE4;
    --shadow:0 24px 60px rgba(27,28,32,0.12), 0 4px 14px rgba(27,28,32,0.06);
    --font:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0D0E12;
      --card:#17191E;
      --ink:#F1F1F3;
      --ink-soft:rgba(241,241,243,0.58);
      --line:rgba(241,241,243,0.1);
      --accent-a:#7B77F5;
      --accent-b:#F06B9C;
      --pill:#1E2026;
      --pill-hover:#262933;
      --shadow:0 24px 60px rgba(0,0,0,0.5), 0 4px 14px rgba(0,0,0,0.3);
    }
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100vh;
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    padding:32px 18px;
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;max-width:380px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:28px;
    box-shadow:var(--shadow);
    padding:38px 30px 28px;
    text-align:center;
    position:relative;
    overflow:hidden;
  }
  .glow{
    position:absolute;top:-70px;left:50%;transform:translateX(-50%);
    width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,var(--accent-a),transparent 70%);
    opacity:0.35;filter:blur(20px);pointer-events:none;
  }

  .avatar{
    position:relative;width:96px;height:96px;margin:0 auto 20px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    display:flex;align-items:center;justify-content:center;
    font-size:32px;font-weight:700;color:#fff;letter-spacing:0.02em;
    box-shadow:0 10px 26px rgba(0,0,0,0.18);
  }

  h1{position:relative;margin:0 0 4px;font-size:23px;font-weight:800;letter-spacing:-0.01em;}
  .role{
    position:relative;margin:0 0 26px;font-size:12.5px;font-weight:600;
    letter-spacing:0.09em;text-transform:uppercase;color:var(--ink-soft);
  }

  .links{display:grid;gap:10px;position:relative;}
  .link{
    display:flex;align-items:center;gap:13px;
    background:var(--pill);border:1px solid var(--line);border-radius:16px;
    padding:13px 15px;text-decoration:none;color:var(--ink);
    transition:background .15s ease, transform .15s ease;
    text-align:left;
  }
  .link:hover{background:var(--pill-hover);transform:translateY(-1px);}
  .link:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px;}
  .link .icon{
    width:36px;height:36px;border-radius:10px;flex-shrink:0;
    background:var(--card);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--accent-a);
  }
  .link .text{display:flex;flex-direction:column;gap:1px;min-width:0;}
  .link .label{font-size:11px;color:var(--ink-soft);font-weight:600;letter-spacing:0.03em;text-transform:uppercase;}
  .link .value{font-size:14.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">

    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="13" rx="2.4"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5l1-2h5l1 2"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11.5a6 6 0 0 1 12 0v6.2c-.8.5-1.6 0-2.2-.6-.6.9-1.9 1.4-2.8.4-.6.9-2.4.9-3 0-.9 1-2.2.5-2.8-.4-.6.6-1.4 1.1-2.2.6z"/><circle cx="9.6" cy="11.6" r=".9" fill="currentColor" stroke="none"/><circle cx="14.4" cy="11.6" r=".9" fill="currentColor" stroke="none"/></symbol>

<div class="card">
  <div class="glow"></div>
  <div class="avatar">JS</div>
  <h1>Julius Scharinger</h1>
  <p class="role">Schüler · Student</p>

  <div class="links">
    <a class="link" href="mailto:julius.scharinger@icloud.com">
      <span class="icon"><svg width="17" height="17"><use href="#i-mail"/></svg></span>
      <span class="text"><span class="label">E-Mail</span><span class="value">julius.scharinger@icloud.com</span></span>

    <a class="link" href="https://instagram.com/julius.sxch" target="_blank" rel="noopener">
      <span class="icon"><svg width="17" height="17"><use href="#i-camera"/></svg></span>
      <span class="text"><span class="label">Instagram</span><span class="value">@julius.sxch</span></span>

      <span class="icon"><svg width="17" height="17"><use href="#i-ghost"/></svg></span>
      <span class="text"><span class="label">Snapchat</span><span class="value">@julius.sch0</span></span>

</body>
</html>
