<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Julius Scharinger</title>
<style>
  :root{
    --bg:#FCFBF8;
    --card:#FFFFFF;
    --ink:#1B1C20;
    --ink-soft:rgba(27,28,32,0.52);
    --line:rgba(27,28,32,0.08);
    --accent-a:#0FB6A6;
    --accent-b:#FF6B4A;
    --pill:#F6FBFA;
    --pill-hover:#EAF6F4;
    --shadow:0 18px 40px rgba(27,28,32,0.08), 0 2px 8px rgba(27,28,32,0.04);
    --font:-apple-system,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0E1416;
      --card:#161D1F;
      --ink:#EFF5F4;
      --ink-soft:rgba(239,245,244,0.55);
      --line:rgba(239,245,244,0.09);
      --accent-a:#37D6C4;
      --accent-b:#FF8566;
      --pill:#1B2325;
      --pill-hover:#212B2D;
      --shadow:0 18px 40px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
    }
  }
  :root[data-theme="light"]{
    --bg:#FCFBF8; --card:#FFFFFF; --ink:#1B1C20; --ink-soft:rgba(27,28,32,0.52);
    --line:rgba(27,28,32,0.08); --accent-a:#0FB6A6; --accent-b:#FF6B4A;
    --pill:#F6FBFA; --pill-hover:#EAF6F4;
    --shadow:0 18px 40px rgba(27,28,32,0.08), 0 2px 8px rgba(27,28,32,0.04);
  }
  :root[data-theme="dark"]{
    --bg:#0E1416; --card:#161D1F; --ink:#EFF5F4; --ink-soft:rgba(239,245,244,0.55);
    --line:rgba(239,245,244,0.09); --accent-a:#37D6C4; --accent-b:#FF8566;
    --pill:#1B2325; --pill-hover:#212B2D;
    --shadow:0 18px 40px rgba(0,0,0,0.45), 0 2px 8px rgba(0,0,0,0.3);
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:var(--font);
    display:flex;align-items:center;justify-content:center;
    padding:20px 16px;
    -webkit-font-smoothing:antialiased;
    transition:background .2s ease;
  }

  .card{
    width:100%;max-width:340px;
    background:var(--card);
    border:1px solid var(--line);
    border-radius:24px;
    box-shadow:var(--shadow);
    padding:28px 22px 20px;
    text-align:center;
    position:relative;
    overflow:hidden;
    transition:background .2s ease, box-shadow .2s ease;
  }
  .glow{
    position:absolute;pointer-events:none;border-radius:50%;filter:blur(24px);
  }
  .glow-a{top:-60px;left:-40px;width:160px;height:160px;background:radial-gradient(circle,var(--accent-a),transparent 70%);opacity:0.30;}
  .glow-b{bottom:-70px;right:-50px;width:180px;height:180px;background:radial-gradient(circle,var(--accent-b),transparent 70%);opacity:0.24;}

  .theme-toggle{
    position:absolute;top:14px;right:14px;z-index:2;
    width:32px;height:32px;border-radius:50%;
    background:var(--pill);border:1px solid var(--line);color:var(--accent-a);
    display:flex;align-items:center;justify-content:center;cursor:pointer;
    transition:background .15s ease;
  }
  .theme-toggle:hover{background:var(--pill-hover);}
  .theme-toggle:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px;}

  .avatar{
    position:relative;width:72px;height:72px;margin:0 auto 12px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent-a),var(--accent-b));
    display:flex;align-items:center;justify-content:center;
    font-size:26px;font-weight:700;color:#fff;letter-spacing:0.02em;
    box-shadow:0 0 0 4px var(--card), 0 8px 20px rgba(0,0,0,0.16);
  }

  h1{position:relative;margin:0 0 2px;font-size:19px;font-weight:800;letter-spacing:-0.01em;}
  .role{
    position:relative;margin:0 0 18px;font-size:11.5px;font-weight:600;
    letter-spacing:0.08em;text-transform:uppercase;color:var(--ink-soft);
  }

  .links{display:grid;gap:7px;position:relative;}
  .link{
    display:flex;align-items:center;gap:11px;
    background:var(--pill);border:1px solid var(--line);border-radius:14px;
    padding:9px 12px;text-decoration:none;color:var(--ink);
    transition:background .15s ease, transform .15s ease;
    text-align:left;
  }
  .link:hover{background:var(--pill-hover);transform:translateY(-1px);}
  .link:active{transform:translateY(0);}
  .link:focus-visible{outline:2px solid var(--accent-a);outline-offset:2px;}
  .icon{
    width:30px;height:30px;border-radius:9px;flex-shrink:0;
    background:var(--card);border:1px solid var(--line);color:var(--accent-a);
    display:flex;align-items:center;justify-content:center;
  }
  .text{display:flex;flex-direction:column;gap:0;min-width:0;}
  .label{font-size:10px;color:var(--ink-soft);font-weight:600;letter-spacing:0.03em;text-transform:uppercase;}
  .value{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0;overflow:hidden" aria-hidden="true">
  <defs>
    <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="1.6"/><path d="M4.5 6.5l7.5 6 7.5-6"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="6.5" width="18" height="13" rx="2.4"/><circle cx="12" cy="13" r="3.6"/><path d="M8.5 6.5l1-2h5l1 2"/></symbol>
    <symbol id="i-ghost" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11.5a6 6 0 0 1 12 0v6.2c-.8.5-1.6 0-2.2-.6-.6.9-1.9 1.4-2.8.4-.6.9-2.4.9-3 0-.9 1-2.2.5-2.8-.4-.6.6-1.4 1.1-2.2.6z"/><circle cx="9.6" cy="11.6" r=".9" fill="currentColor" stroke="none"/><circle cx="14.4" cy="11.6" r=".9" fill="currentColor" stroke="none"/></symbol>
    <symbol id="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M3 12h2M19 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5z"/></symbol>
  </defs>
</svg>

<div class="card">
  <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Hell-/Dunkelmodus umschalten">
    <svg width="16" height="16" id="theme-icon"><use href="#i-moon"/></svg>
  </button>
  <div class="glow glow-a"></div>
  <div class="glow glow-b"></div>
  <div class="avatar">JS</div>
  <h1>Julius Scharinger</h1>
  <p class="role">Schüler · Student</p>

  <div class="links">
    <a class="link" href="mailto:julius.scharinger@icloud.com">
      <span class="icon"><svg width="15" height="15"><use href="#i-mail"/></svg></span>
      <span class="text"><span class="label">E-Mail</span><span class="value">julius.scharinger@icloud.com</span></span>
    </a>
    <a class="link" href="https://instagram.com/julius.sxch" target="_blank" rel="noopener">
      <span class="icon"><svg width="15" height="15"><use href="#i-camera"/></svg></span>
      <span class="text"><span class="label">Instagram</span><span class="value">@julius.sxch</span></span>
    </a>
    <a class="link" href="https://www.snapchat.com/add/julius.sch0" target="_blank" rel="noopener">
      <span class="icon"><svg width="15" height="15"><use href="#i-ghost"/></svg></span>
      <span class="text"><span class="label">Snapchat</span><span class="value">@julius.sch0</span></span>
    </a>
  </div>
</div>

<script>
  (function(){
    var root = document.documentElement;
    var stored = localStorage.getItem('jc-theme');
    var mode = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    root.setAttribute('data-theme', mode);

    var btn = document.getElementById('theme-toggle');
    var icon = document.getElementById('theme-icon');
    function paintIcon(m){
      icon.innerHTML = '<use href="#' + (m === 'dark' ? 'i-sun' : 'i-moon') + '"/>';
    }
    paintIcon(mode);

    btn.addEventListener('click', function(){
      mode = mode === 'dark' ? 'light' : 'dark';
      root.setAttribute('data-theme', mode);
      localStorage.setItem('jc-theme', mode);
      paintIcon(mode);
    });
  })();
</script>

</body>
</html>
